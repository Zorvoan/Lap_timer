# Runs scripts/official-tracks.ts with the job in scripts/official-tracks.job.json whenever that
# job (or the script) changes on the deploy branch. Inspecting or publishing official tracks needs
# the FIREBASE_SERVICE_ACCOUNT secret with the "Cloud Datastore User" role.
name: Official tracks

on:
  push:
    branches: [main]
    paths:
      - scripts/official-tracks.job.json
      - scripts/official-tracks.ts
  workflow_dispatch:

concurrency:
  group: official-tracks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run job
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npx tsx scripts/official-tracks.ts
