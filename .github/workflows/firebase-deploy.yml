# Builds the PWA and deploys it to Firebase Hosting (https://laptimer-okwph.web.app).
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a service account with
# the "Firebase Hosting Admin" and "API Keys Viewer" roles on project laptimer-okwph. Optional:
# CARTO_API_KEY, a CARTO basemaps key for the maps (https://carto.com/basemaps/apikey/).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build (Firebase mode)
        run: npm run build:firebase -w @laptimer/web
        env:
          # Optional CARTO basemaps key (sharper, faster maps); without it the maps use OpenStreetMap.
          VITE_CARTO_KEY: ${{ secrets.CARTO_API_KEY }}

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: laptimer-okwph
          channelId: live
          # 15.34.1 also checks serviceusage.services.get, which the deploy service account doesn't
          # have (403). Raise this once the account has the "Service Usage Consumer" role.
          firebaseToolsVersion: 15.34.0
