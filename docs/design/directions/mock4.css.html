<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600;800;900&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#2c2d30; font-family:Inter, sans-serif; color:#f4f4f5; padding:32px; }
section { margin-bottom:56px; }
.dir { max-width:1226px; margin-bottom:18px; }
.dir h2 { font-size:28px; font-weight:800; color:#fff; }
.chars { color:#d9dadd; font-size:14.5px; line-height:1.5; margin-top:8px; }
.trade { color:#d9dadd; font-size:14.5px; line-height:1.5; margin-top:8px; padding-left:12px; border-left:3px solid #e10600; }
.trade b { color:#fff; margin-right:6px; }
.grid { display:grid; grid-template-columns:repeat(3,390px); gap:28px; }
.cap { color:#fff; font-size:14px; font-weight:600; margin-bottom:10px; }
.phone { width:390px; height:780px; border-radius:30px; overflow:hidden; position:relative; border:1px solid #000; }
.ic { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.pu { color:#b36bff !important; } .gr { color:#20d97a !important; } .ye { color:#ffd21f !important; } .rd { color:#ff4a3d !important; } .dim { color:#6f737a !important; }

/* A: timing monitor */
.a { background:#000; font-family:"Barlow Condensed", sans-serif; }
.a-top { display:flex; justify-content:space-between; align-items:center; padding:18px 18px 10px; border-bottom:1px solid #222; }
.a-h { font-size:30px; font-weight:800; letter-spacing:.02em; }

.a-gps i { width:9px; height:9px; background:#20d97a; border-radius:50%; display:inline-block; }
.a-k { font-size:13px; font-weight:700; letter-spacing:.14em; color:#8b8f96; }
.a-near { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:#111; border-bottom:1px solid #222; }
.a-nn { font-size:28px; font-weight:800; margin-top:2px; }
.a-go { background:#e10600; color:#fff; font-weight:800; font-size:19px; letter-spacing:.08em; display:flex; align-items:center; gap:8px; padding:10px 18px; border-radius:4px; }
.a-go.big { justify-content:center; padding:16px; font-size:22px; }
.a-t { width:100%; border-collapse:collapse; table-layout:fixed; }
.a-t th:nth-child(1){width:40%} .a-t th:nth-child(3){width:13%} .a-cls th:nth-child(1){width:34%}
.a-t th { font-size:12.5px; letter-spacing:.12em; color:#6f737a; text-align:right; padding:10px 10px 6px; font-weight:700; }
.a-t th:first-child { text-align:left; padding-left:18px; }
.a-t td { border-top:1px solid #1b1b1b; padding:9px 10px; }
.a-tn { white-space:nowrap; font-size:21px; font-weight:700; text-transform:uppercase; padding-left:18px !important; }
.a-tn span { display:block; font-size:12.5px; color:#6f737a; letter-spacing:.1em; font-weight:600; }
.a-num { font-size:20px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.a-pos { font-size:20px; font-weight:800; text-align:right; color:#20d97a; }
.a-legend { font-size:13px; color:#8b8f96; padding:12px 18px; letter-spacing:.04em; }
.a-legend span { margin-left:8px; } .a-legend span:first-child { margin-left:0; }
.a-nav { position:absolute; bottom:0; left:0; right:0; height:74px; border-top:1px solid #222; display:grid; grid-template-columns:1fr 1fr 1fr; background:#000; }
.a-nit { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#6f737a; font-size:14px; font-weight:700; letter-spacing:.12em; }
.a-nit.on { color:#fff; box-shadow:inset 0 3px 0 #e10600; }
.a-drive { margin:12px 6px; background:#e10600; border-radius:4px; display:flex; align-items:center; justify-content:center; gap:7px; font-weight:800; font-size:18px; letter-spacing:.1em; }
.a-lap { text-align:center; font-size:112px; font-weight:800; line-height:.95; font-variant-numeric:tabular-nums; }
.a-bar { position:relative; height:26px; margin:10px 18px 0; background:#141414; border-radius:3px; }
.a-zero { position:absolute; left:50%; top:-6px; bottom:-6px; width:2px; background:#fff; }
.a-fill { position:absolute; top:0; bottom:0; background:#20d97a; border-radius:3px 0 0 3px; }
.a-delta { text-align:center; font-size:76px; font-weight:800; line-height:1; margin-top:8px; font-variant-numeric:tabular-nums; }
.a-secs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:22px 18px 0; }
.a-sec { background:#141414; text-align:center; padding:8px 0; font-size:30px; font-weight:800; border-top:4px solid #333; font-variant-numeric:tabular-nums; }
.a-sec b { display:block; font-size:13px; letter-spacing:.14em; color:#8b8f96; }
.a-sec.pu { border-top-color:#b36bff; } .a-sec.gr { border-top-color:#20d97a; } .a-sec.off { color:#444; }
.a-prog { position:relative; height:8px; margin:26px 18px 0; background:#1b1b1b; }
.a-pf { position:absolute; top:0; bottom:0; left:0; background:#fff; }
.a-prog i { position:absolute; top:-5px; bottom:-5px; width:2px; background:#555; }
.a-pl { display:flex; justify-content:space-between; margin:8px 18px 0; font-size:15px; font-weight:700; color:#8b8f96; letter-spacing:.08em; }
.a-stop { position:absolute; bottom:18px; left:18px; right:18px; height:56px; border:1px solid #333; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:22px; letter-spacing:.12em; border-radius:4px; }
.a-res { display:flex; align-items:center; gap:18px; padding:22px 18px; border-bottom:1px solid #222; }
.a-p { font-size:96px; font-weight:800; line-height:.85; color:#e10600; }
.a-rt { font-size:58px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.a-cls td { padding:12px 10px; }
.a-btns { position:absolute; left:18px; right:18px; bottom:92px; display:grid; gap:8px; }
.a-sec2 { border:1px solid #333; text-align:center; padding:13px; font-size:19px; font-weight:800; letter-spacing:.1em; border-radius:4px; }

/* B: stage book */
.b { background:#f2efe8; color:#141414; font-family:Archivo, sans-serif; }
.b.dark { background:#0f1012; color:#f4f4f5; }
.b-head { padding:22px 20px 12px; }
.b-kick { font-size:12.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#8a5a2b; }
.b-h { font-size:38px; font-weight:900; letter-spacing:-.02em; line-height:1.05; margin-top:4px; }
.b-near { margin:4px 20px 12px; display:flex; align-items:center; gap:10px; font-size:14px; padding:10px 12px; background:#141414; color:#f2efe8; border-radius:6px; }
.b-near b { font-weight:800; }
.b-go { margin-left:auto; display:flex; align-items:center; gap:6px; background:#e10600; color:#fff; font-weight:800; padding:8px 12px; border-radius:5px; }
.b-card { display:flex; gap:14px; align-items:center; padding:12px 20px; border-top:1px solid #d8d2c4; }

.b-route { background:#e7e2d6; border-radius:8px; flex-shrink:0; }
.b-mid { flex:1; min-width:0; }
.b-code { font-family:"IBM Plex Mono", monospace; font-size:12.5px; font-weight:700; color:#e10600; }
.b-name { font-size:19px; font-weight:800; line-height:1.15; }
.b-km { font-size:13px; color:#6b6458; margin-top:3px; }
.b-climb { font-size:12.5px; color:#8a5a2b; font-weight:600; margin-top:2px; }
.b-right { text-align:right; }
.b-time { font-family:"IBM Plex Mono", monospace; font-size:17px; font-weight:700; }
.b-sub { font-size:12.5px; color:#2f8a4f; font-weight:700; margin-top:2px; }
.b-none { font-size:13px; color:#8b8478; max-width:90px; }
.b-nav { position:absolute; bottom:0; left:0; right:0; height:74px; display:grid; grid-template-columns:1fr 1fr 1fr; background:#f2efe8; border-top:1px solid #d8d2c4; }
.b-nit { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#8b8478; font-size:12.5px; font-weight:600; }
.b-nit.on { color:#141414; box-shadow:inset 0 3px 0 #e10600; }
.b-drive { margin:12px 6px; background:#141414; color:#fff; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:7px; font-weight:800; font-size:15px; }
.b-dtop { display:flex; justify-content:space-between; padding:20px 20px 0; font-size:14px; font-weight:600; color:#a7a9ad; }
.b-ok { color:#20d97a; }
.b-prof { display:block; margin-top:6px; }
.b-area { fill:#1c1e22; } .b-line { fill:none; stroke:#e9e6df; stroke-width:3; }
.b-split { stroke:#3a3d42; stroke-dasharray:4 5; }
.b-me { fill:#e10600; stroke:#fff; stroke-width:3; } .b-ghost { fill:none; stroke:#20d97a; stroke-width:3; }
.b-mel { fill:#fff; font-size:13px; font-weight:800; text-anchor:middle; font-family:Archivo; }
.b-ghl { fill:#20d97a; font-size:12px; font-weight:700; text-anchor:middle; font-family:Archivo; }
.b-ax { fill:#6f737a; font-size:12px; font-family:"IBM Plex Mono"; }
.b-dd { text-align:center; margin-top:4px; }
.b-dl { font-size:14px; color:#20d97a; font-weight:700; letter-spacing:.04em; }
.b-dv { font-family:"IBM Plex Mono", monospace; font-size:96px; font-weight:700; color:#20d97a; line-height:1; }
.b-dt { display:flex; justify-content:space-between; align-items:baseline; margin:14px 24px 0; padding-top:12px; border-top:1px solid #26282c; font-size:15px; color:#a7a9ad; }
.b-dt b { font-family:"IBM Plex Mono", monospace; font-size:32px; color:#f4f4f5; }
.b-stop { position:absolute; bottom:18px; left:20px; right:20px; height:56px; border:1px solid #33363b; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:18px; }
.b-card2 { margin:22px 20px 8px; background:#fbfaf6; border:1px solid #d8d2c4; border-radius:6px; padding:18px; position:relative; box-shadow:0 1px 0 #d8d2c4, 0 2px 0 #ece7dc; }
.b-tc span { font-size:12.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#8b8478; display:block; }
.b-tc b { font-family:"IBM Plex Mono", monospace; font-size:50px; font-weight:700; line-height:1.1; }
.b-stamp { position:absolute; right:12px; top:-16px; background:#fbfaf6; transform:rotate(-8deg); border:3px solid #6a2bd1; color:#6a2bd1; font-weight:900; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; padding:6px 9px; border-radius:6px; text-align:center; line-height:1.25; }
.b-rule { border-top:1px dashed #cfc7b6; margin:14px 0; }
.b-tr { display:flex; align-items:baseline; gap:10px; padding:5px 0; font-size:15px; }
.b-tr span { flex:1; color:#6b6458; }
.b-tr b { font-family:"IBM Plex Mono", monospace; font-size:19px; }
.b-tr i { font-style:normal; font-family:"IBM Plex Mono", monospace; font-size:14px; width:56px; text-align:right; color:#8b8478; font-weight:600; }
.b-tr i.gr { color:#1f8a4c !important; } .b-tr i.rd { color:#c42a1f !important; }
.b-btns { position:absolute; left:20px; right:20px; bottom:92px; display:grid; gap:8px; }
.b-go.big { justify-content:center; padding:16px; font-size:18px; margin-left:0; }
.b-sec { text-align:center; padding:14px; font-weight:700; border:1px solid #cfc7b6; border-radius:6px; }

/* C: map first */
.c { background:#111418; }
.c-map { position:absolute; top:0; left:0; }
.c-r { fill:none; stroke:#5d646d; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.c-sel { stroke:#e10600; stroke-width:6; }
.c-lb { fill:#1b1f24; stroke:#2e343b; } .c-lbs { fill:#e10600; stroke:#e10600; }
.c-lt { fill:#e8e9eb; font-size:12px; font-weight:700; font-family:Inter; }
.c-search { position:absolute; top:16px; left:16px; right:16px; height:46px; background:#1b1f24ee; border:1px solid #2e343b; border-radius:12px; display:flex; align-items:center; padding:0 16px; color:#a7abb1; font-size:14.5px; font-weight:500; }
.c-sheet { position:absolute; left:0; right:0; bottom:74px; background:#181b20; border-radius:18px 18px 0 0; border-top:1px solid #2e343b; padding:8px 18px 18px; }
.c-grab { width:40px; height:4px; border-radius:2px; background:#3a4048; margin:0 auto 12px; }
.c-row { display:flex; align-items:center; gap:14px; }
.c-k { font-size:12.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#ff6a60; }
.c-n { font-size:24px; font-weight:800; margin-top:2px; }
.c-m { font-size:13.5px; color:#a7abb1; margin-top:3px; }
.c-m b { color:#f4f4f5; font-variant-numeric:tabular-nums; }
.c-go { background:#e10600; color:#fff; border-radius:12px; padding:14px 18px; font-weight:800; font-size:16px; display:flex; align-items:center; gap:8px; }
.c-sec { background:#262b31; border-radius:12px; padding:14px 22px; font-weight:700; }
.c-nav { position:absolute; bottom:0; left:0; right:0; height:74px; display:grid; grid-template-columns:1fr 1fr 1fr; background:#0b0d10; border-top:1px solid #23282e; }
.c-nit { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#7b8088; font-size:12.5px; font-weight:600; }
.c-nit.on { color:#fff; box-shadow:inset 0 3px 0 #e10600; }
.c-drive { margin:12px 6px; background:#e10600; color:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:7px; font-weight:800; font-size:15px; }
.c-ahead { fill:none; stroke:#e10600; stroke-width:16; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }
.c-done { fill:none; stroke:#3a4048; stroke-width:16; stroke-linecap:round; stroke-linejoin:round; }
.c-pill { position:absolute; top:22px; left:50%; transform:translateX(-50%); background:#06200fee; border:2px solid #20d97a; border-radius:20px; padding:8px 26px 10px; text-align:center; }
.c-pill span { display:block; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#7fe0aa; }
.c-pill b { font-family:"IBM Plex Mono", monospace; font-size:56px; line-height:1; color:#20d97a; }
.c-hud { position:absolute; left:16px; right:16px; bottom:96px; display:grid; grid-template-columns:1fr 1fr 1fr; background:#0b0d10ee; border:1px solid #2e343b; border-radius:14px; }
.c-hud div { text-align:center; padding:12px 0; }
.c-hud div + div { border-left:1px solid #2e343b; }
.c-hud span { display:block; font-size:12px; color:#8b9097; font-weight:600; }
.c-hud b { font-family:"IBM Plex Mono", monospace; font-size:24px; }
.c-stopw { position:absolute; left:16px; right:16px; bottom:18px; height:62px; background:#1b1f24; border:1px solid #2e343b; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:18px; }
.c-gain { fill:none; stroke:#20d97a; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.c-loss { fill:none; stroke:#ff4a3d; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.c-top3 { position:absolute; top:18px; left:18px; right:18px; }
.c-big { font-family:"IBM Plex Mono", monospace; font-size:56px; font-weight:700; line-height:1.05; margin-top:4px; }
.c-key { position:absolute; left:18px; bottom:200px; display:flex; gap:14px; font-size:13px; color:#a7abb1; }

</style></head><body>
