services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: laptimer
      POSTGRES_PASSWORD: laptimer
      POSTGRES_DB: laptimer
    ports:
      - '5432:5432'
    volumes:
      - laptimer-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U laptimer']
      interval: 5s
      retries: 10

volumes:
  laptimer-db:
